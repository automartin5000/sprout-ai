name: build
on:
  push:
    branches:
      - "**"
      - "!main"
  pull_request: {}
jobs:
  build:
    name: Build + synth + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck || echo "no typecheck script — skipping"

      - name: Build app
        run: bun run build

      - name: CDK synth (dev + prod)
        run: bun projen synth

      - name: Upload CDK artifact for prod-deploy
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out-${{ github.sha }}
          path: cdk.out/
          retention-days: 7

      - name: Run tests
        run: bun run test || echo "no test script — skipping"
